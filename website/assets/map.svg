<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <title>춘의역탑부동산 찾아오시는 길 (개략 약도)</title>
  <rect width="640" height="480" fill="#F3F1EC"/>
  <!-- blocks -->
  <g fill="#E6E2D9">
    <rect x="30" y="30" width="200" height="140" rx="6"/>
    <rect x="290" y="30" width="320" height="140" rx="6"/>
    <rect x="30" y="230" width="200" height="220" rx="6"/>
    <rect x="290" y="230" width="150" height="220" rx="6"/>
    <rect x="480" y="230" width="130" height="220" rx="6"/>
  </g>
  <!-- main roads -->
  <g fill="#FFFFFF" stroke="#D3CEC3" stroke-width="1">
    <rect x="0" y="178" width="640" height="44"/>
    <rect x="238" y="0" width="44" height="480"/>
  </g>
  <rect x="448" y="222" width="24" height="258" fill="#FFFFFF" stroke="#D3CEC3"/>
  <!-- road center lines -->
  <g stroke="#E2C77A" stroke-width="2" stroke-dasharray="14 10">
    <line x1="0" y1="200" x2="640" y2="200"/>
    <line x1="260" y1="0" x2="260" y2="480"/>
  </g>
  <text x="500" y="194" font-size="13" fill="#8A8476">[입력: 도로명]</text>
  <text x="270" y="470" font-size="13" fill="#8A8476" transform="rotate(-90 270 470)">[입력: 도로명]</text>

  <!-- subway line 7 underground hint -->
  <line x1="0" y1="200" x2="640" y2="200" stroke="#6B7A2E" stroke-width="6" opacity="0.18"/>

  <!-- station -->
  <g transform="translate(150,200)">
    <rect x="-62" y="-22" width="124" height="44" rx="22" fill="#6B7A2E"/>
    <circle cx="-38" cy="0" r="13" fill="#FFFFFF"/>
    <text x="-38" y="5" font-size="14" font-weight="700" fill="#6B7A2E" text-anchor="middle">7</text>
    <text x="12" y="6" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">춘의역</text>
  </g>
  <!-- exit marker -->
  <g transform="translate(205,232)">
    <rect x="-40" y="-12" width="80" height="24" rx="5" fill="#F5A623"/>
    <text x="0" y="5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6번 출구</text>
  </g>

  <!-- walking path -->
  <path d="M205 246 L205 262 L320 262 L320 300 L370 300" fill="none" stroke="#D97706" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- office marker -->
  <g transform="translate(370,300)">
    <circle r="34" fill="#D97706" opacity="0.15"/>
    <path d="M0 -40 C-19 -40 -30 -26 -30 -12 C-30 8 0 30 0 30 C0 30 30 8 30 -12 C30 -26 19 -40 0 -40 Z" transform="translate(0,-28)" fill="#0F294A"/>
    <circle cx="0" cy="-41" r="10" fill="#FFFFFF"/>
    <text x="0" y="-37" font-size="11" font-weight="700" fill="#0F294A" text-anchor="middle">탑</text>
  </g>
  <g transform="translate(370,330)">
    <rect x="-86" y="0" width="172" height="52" rx="8" fill="#0F294A"/>
    <text x="0" y="22" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">춘의역탑부동산</text>
    <text x="0" y="41" font-size="11" fill="#E8E3D6" text-anchor="middle">춘의동 123-56 1층</text>
  </g>

  <!-- walking time badge -->
  <g transform="translate(150,300)">
    <rect x="-56" y="-14" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <text x="0" y="5" font-size="13" fill="#D97706" text-anchor="middle" font-weight="700">도보 약 1분</text>
  </g>

  <!-- compass -->
  <g transform="translate(590,70)">
    <circle r="22" fill="#FFFFFF" stroke="#D3CEC3"/>
    <path d="M0 -16 L6 2 L0 -2 L-6 2 Z" fill="#B8893B"/>
    <text x="0" y="16" font-size="11" fill="#5C5648" text-anchor="middle" font-weight="700">N</text>
  </g>

  <text x="620" y="466" font-size="11" fill="#8A8476" text-anchor="end">개략 약도 · 실제 경로는 지도 앱에서 확인하세요</text>
</svg>
